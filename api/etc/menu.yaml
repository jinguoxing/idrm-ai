# IDRM 菜单管理服务配置文件
# 文档: https://go-zero.dev/docs/config

Name: idrm-menu-api
Host: 0.0.0.0
Port: 8080

# 超时配置（毫秒）
Timeout: 30000

# 数据库配置
# SQLx数据源（使用SQLite演示）
DataSource: ./idrm.db

# GORM数据源（使用SQLite演示）
GormDSN: ./idrm.db

# Redis配置
RedisHost: 127.0.0.1:6379
RedisPass: ""
RedisType: node

# 日志配置
Log:
  ServiceName: idrm-menu-api
  Mode: console
  Level: info

# 限流配置（可选）
# RateLimit:
#   Seconds: 1
#   Capacity: 100

# JWT配置（如果需要认证）
# JwtAuth:
#   Secret: your-secret-key
#   Expire: 86400
